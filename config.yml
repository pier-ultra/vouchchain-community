# VouchChain 社区版默认配置 —— 由程序首次运行自动生成，可自行修改后重启生效。
# 删除本文件后重启可恢复默认（会重新生成）。
server:
  address: ":8000"
  indexFiles: ["index.html"]
  openapi:
    path: "/swagger"

database:
  default:
    # 默认 SQLite（零依赖零配置，适合单机自托管 / 快速体验）
    type: "sqlite"
    link: "sqlite::@file(./data/vouchchain.db)"

app:
  # dev 态：跳过验签、注入 dev 用户，双击即可体验。
  # 生产/交付：设置环境变量 APP_DEV_MODE=false 切 SSO 态（需 CASDOOR_CERTIFICATE 或 CASDOOR_CERT_FILE）。
  devMode: true
  casdoor:
    endpoint: ""
    clientId: ""
    clientSecret: ""
    certificate: ""
    orgName: ""
    appName: ""
    audience: ""
    issuer: ""
  scim:
    token: ""
  eino:
    baseUrl: "https://api.agnes-ai.cn/v1"
    model: "agnes-3.0-flash"

cache:
  driver: "memory"

redis:
  default:
    address: "127.0.0.1:6666"
    db: 0
