name: Release

# 打 tag（v*）自动出全平台发布包：
# 前端 web/dist → build-release.py 交叉编译 6 平台（linux/windows/darwin × amd64/arm64）→ 上传 GitHub Releases。
# 本地等价操作：npm run build（web/）+ python scripts/build-release.py <版本号>。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端（web/dist）
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 交叉编译 6 平台发布包
        run: python3 scripts/build-release.py "${GITHUB_REF_NAME#v}"

      - name: 上传到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/vouchchain-*
          generate_release_notes: true
