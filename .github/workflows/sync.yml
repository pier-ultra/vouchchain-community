name: Sync to Gitee

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 镜像推送到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://pier-ultra:${GITEE_TOKEN}@gitee.com/pier-ultra/vouchchain-community.git"
          git push gitee main --force
          git push gitee --tags --force
