name: CI

# 推送 / PR 自动验收：格式检查 → 编译 → 全量单测。
# 纯 Go sqlite 驱动（CGO_ENABLED=0），ubuntu runner 直接可跑，无需任何数据库服务。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt 格式检查
        run: |
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then
            echo "::error::以下文件未通过 gofmt："
            echo "$OUT"
            exit 1
          fi

      - name: go build
        run: go build -trimpath ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -trimpath -timeout 15m ./pkg/... ./internal/...
